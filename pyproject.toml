[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abcd-jarvis-assistant"
version = "1.0.0"
description = "A small Jarvis-style terminal and voice assistant."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
voice = [
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10",
]
features = [
    "pyjokes>=0.6.0",
    "wikipedia>=1.4.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
jarvis = "jarvis_assistant.cli:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
